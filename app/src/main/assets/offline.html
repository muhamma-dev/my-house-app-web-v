<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My House</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#eef1f6;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;padding:20px}
.c{width:100%;max-width:420px;background:#151922;border:1px solid rgba(255,255,255,.06);border-radius:26px;padding:24px;text-align:center}
.logo{width:68px;height:68px;border-radius:22px;background:#ffb83d;color:#1a1200;display:grid;place-items:center;margin:0 auto 14px;font-size:34px}
h2{margin:6px 0 8px;font-size:22px}p{color:#8a93a3;line-height:1.7;margin:6px 0}
input{width:100%;margin:14px 0 8px;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:#1f2430;color:#eef1f6;font-size:16px;direction:ltr;text-align:center;outline:0}
button{width:100%;margin-top:8px;border:0;border-radius:15px;padding:14px;background:#ffb83d;color:#1a1200;font-weight:800;font-size:15px}
.sp{width:34px;height:34px;border:4px solid #1f2430;border-top-color:#ffb83d;border-radius:50%;margin:16px auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
*{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}
</style></head><body><div class="c">
<div class="logo">&#128161;</div>
<div id="ld"><h2>My House</h2><div class="sp"></div><p>عم دوّر على الجهاز...</p></div>
<div id="of" style="display:none"><h2>ما لقيت الجهاز</h2>
<p>تأكد إنك على واي فاي البيت. إذا الجهاز موجود بس ما انلقى، اكتب عنوانو (بيظهر على شاشة الأوليد) وجرّب.</p>
<input id="a" placeholder="192.168.1.50" inputmode="decimal">
<button onclick="var v=document.getElementById('a').value.trim();if(v){MHNative.setAddr(v)}else{MHNative.retry()}">جرّب</button>
</div>
<script>
if(location.search.indexOf('loading=1')<0){document.getElementById('ld').style.display='none';document.getElementById('of').style.display='block'}
else{setTimeout(function(){document.getElementById('ld').style.display='none';document.getElementById('of').style.display='block'},14000)}
</script></div></body></html>
