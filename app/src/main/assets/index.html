function icon(n){return '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(IC[n]||IC.bulb)+'</svg>'}
function roomIcon(s){
  s=(s||'').toLowerCase();
  if(/نوم|bed|sleep/.test(s))return 'bed';
  if(/صالون|جلوس|ضيوف|living|sofa|lounge/.test(s))return 'sofa';
  if(/مطبخ|kitchen/.test(s))return 'kitchen';
  if(/حمام|حمّام|toilet|bath|wc/.test(s))return 'bath';
  if(/مدخل|ممر|باب|درج|entry|hall|door|stair/.test(s))return 'door';
  if(/تلفزيون|tv|media|سينما/.test(s))return 'tv';
  return 'bulb';
}
const THEMES=['dark','light','amoled','color'];
let S=null,view='',hold=0;
let token=localStorage.getItem('tok')||'';
let lang=localStorage.getItem('lang')||'ar';
let theme=localStorage.getItem('theme')||'dark';
const $=id=>document.getElementById(id);
const t=k=>(L[lang][k]||k);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function ic(n,cls){const s=el('span',cls||'');s.innerHTML=icon(n);return s}
function look(){
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.documentElement.lang=lang;
  document.documentElement.setAttribute('data-theme',theme);
  const c=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  document.querySelector('meta[name=theme-color]').setAttribute('content',c||'#0b0d12');
}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
async function api(p,m,b){
  const o={method:m||'GET',headers:{}};
  if(token)o.headers['X-Token']=token;
  if(b!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}
  const r=await fetch(p,o);
  const j=await r.json().catch(()=>({}));
  j._s=r.status;
  if(r.status===401){token='';localStorage.removeItem('tok')}
  if(r.status===403&&j.err==='banned'&&p!=='/api/state')setTimeout(poll,0);
  return j;
}
async function poll(){
  if(Date.now()<hold)return;
  try{S=await api('/api/state');if(!S.rooms)S.rooms=(S.ch||[]).map(c=>({id:c.i,n:c.n,ch:[c.i]}));render();
    if(!S.tv){api('/api/time','POST',{epoch:Math.floor(Date.now()/1000),tz:-new Date().getTimezoneOffset()})}
  }catch(e){const c=$('pill');if(c){c.className='pill';c.lastChild.textContent=t('offl')}}
}
const P_ALL=1,P_OWN=2,P_VIEW=4,P_EDIT=8,P_OWNER=16,P_SCHED=32,P_LOG=64;
const ROLEIC=['shield','shield','users','kid'];
const ICL=['bulb','bed','sofa','kitchen','bath','door','tv','lamp','desk','garden','garage','stairs','kid','book','sun','moon','star','home','bolt','plane'];
function roomIc(r){return (r&&r.ic!==undefined&&r.ic<ICL.length)?ICL[r.ic]:roomIcon(r?r.n:'')}
function lightIc(c){return (c&&c.ic!==undefined&&c.ic<ICL.length)?ICL[c.ic]:'bulb'}
function can(p){return !!S&&((S.p||0)&p)===p}
function roleTxt(r){return t('ac_r'+r)}
function accName(a){return (S&&S.me&&S.me.a===a&&S.me.n)||('#'+(a+1))}
async function refreshState(){
  S=await api('/api/state');
  if(!S.rooms)S.rooms=(S.ch||[]).map(c=>({id:c.i,n:c.n,ch:[c.i]}));
}
async function logout(){
  try{await api('/api/logout','POST',{})}catch(e){}
  token='';localStorage.removeItem('tok');
  $('modal').classList.add('hide');
  await refreshState();view='';render();
}
let JR='family',JN=localStorage.getItem('nm')||'';
function loginBox(host,done,cancel){
  host.innerHTML='';
  if(S&&S.ban){host.append(el('h2','',t('j_banned')));return}
  host.append(el('h2','',t('j_who')));
  host.append(seg([['family',t('j_family')],['admin',t('j_admin')]],JR,v=>{JR=v;loginBox(host,done,cancel)}));
  const out=el('div','msg');
  let pw=null;
  if(JR==='admin'){pw=el('input','fld');pw.type='password';pw.placeholder=t('j_pw');pw.autocomplete='off';host.append(pw)}
  const ni=el('input','fld');ni.maxLength=14;ni.placeholder=t('j_name');ni.value=JN;ni.oninput=()=>{JN=ni.value};
  host.append(ni,out);
  const go=el('button','btn',t('j_go'));go.style.width='100%';
  go.onclick=async()=>{
    const n=ni.value.trim();
    if(!n){out.textContent=t('j_nameReq');out.className='msg err';return}
    const b={role:JR,name:n};if(JR==='admin')b.pw=pw.value;
    go.disabled=true;
    const r=await api('/api/join','POST',b);
    go.disabled=false;
    if(r.ok){token=r.token;localStorage.setItem('tok',token);localStorage.setItem('nm',n);await refreshState();done()}
    else{
      out.className='msg err';
      out.textContent=r.err==='banned'?t('j_banned'):r._s===429?t('locked'):r.err==='full'?t('j_full'):r.err==='bad'?t('wrong'):t('err');
      if(pw)pw.value='';
    }
  };
  ni.onkeydown=e=>{if(e.key==='Enter')go.click()};
  host.append(go);
  if(cancel){const cb=el('button','btn sec2',t('close'));cb.style.cssText='width:100%;margin-top:10px';cb.onclick=cancel;host.append(cb)}
}
function loginPage(){
  look();openR=null;
  $('modal').classList.add('hide');
  const a=$('app');a.innerHTML='';
  const box=el('div','wiz');a.append(box);
  const lg=el('div','logo');lg.innerHTML=icon('bulb');box.append(lg);
  box.append(el('h1','',t('title')));
  const host=el('div');box.append(host);
  loginBox(host,()=>{view='';render()},null);
  const r=el('div','row');r.style.marginTop='18px';
  const b1=el('button','btn sec2 sm',t('lang'));b1.onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('lang',lang);loginPage()};
  const b2=el('button','btn sec2 sm',t('theme'));b2.onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];localStorage.setItem('theme',theme);look()};
  r.append(b1,b2);box.append(r);
}
function render(){
  if(!S)return;
  if(S.login){if(view!=='login'){view='login';loginPage()}return}
  if(!S.cfg){if(view!=='wiz'){view='wiz';wizShow()}return}
  if(view!=='dash'){view='dash';dashBuild()}
  dashUpdate();
}

function roomOn(r){return r.ch.some(i=>S.ch[i].on)}
function dashBuild(){
  look();sig='';
  const a=$('app');a.innerHTML='';
  const top=el('div','top');
  const l=el('div');
  const h=new Date().getHours();
  l.append(el('div','hello',(h<12?t('gm'):t('ge'))+(S.me&&S.me.a>=0?'، '+accName(S.me.a):'')),el('h1','',t('title')));
  const tools=el('div','tools');
  const bt=el('button','ic');bt.innerHTML=icon('palette');
  bt.onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];localStorage.setItem('theme',theme);look()};
  const bl=el('button','ic txt',t('lang'));
  bl.onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('lang',lang);dashBuild();dashUpdate()};
  const bu=el('button','ic');bu.innerHTML=icon('user');bu.onclick=meUI;
  tools.append(bu,bt,bl);
  if(can(P_ALL)){const bo=el('button','ic');bo.innerHTML=icon('msg');bo.onclick=openMq;tools.prepend(bo)}
  top.append(l,tools);
  const hero=el('div','hero');
  const hl=el('div');

let ST=null,stAt=0,stBusy=null,stView={k:'',i:-1,back:null},stTimer=null,rufAt=0;
const SP={p:'7',m:'h'};
function getStats(maxAge){
  if(ST&&Date.now()-stAt<maxAge)return Promise.resolve(ST);
  if(stBusy)return stBusy;
  stBusy=api('/api/stats').then(r=>{stBusy=null;if(r.ok){ST=r;stAt=Date.now()}return ST}).catch(()=>{stBusy=null;return ST});
  return stBusy;

function ltr(x){return '\u2066'+x+'\u2069'}
function fmtDur(s){
  const h=Math.floor(s/3600),mm=Math.floor((s%3600)/60);
  if(h>=100)return h+' '+t('hr');
  if(h>0)return h+' '+t('hr')+(mm?' '+mm+' '+t('mn'):'');
  if(mm>0)return mm+' '+t('mn');
  return s>0?'<1 '+t('mn'):'0';
}
function fmtE(mwh){
  const wh=mwh/1000;
  if(wh>=1000){const k=wh/1000;return ltr((k>=100?k.toFixed(0):k.toFixed(2))+' kWh')}
  if(wh>=100)return ltr(wh.toFixed(0)+' Wh');
  return ltr(wh.toFixed(wh>=10?1:2)+' Wh');
}
function fmtC(mwh){
  const p=ST?ST.price:0;
  if(!(p>0))return '—';
  const c=mwh/1e6*p;
  return ltr((c>=100?c.toFixed(0):c>=1?c.toFixed(2):c.toFixed(3))+(ST.cur?' '+ST.cur:''));
}
function fmtM(m,v){return m==='h'?fmtDur(v):m==='e'?fmtE(v):fmtC(v)}
function mval(a,m){return m==='h'?a.sec:a.mwh}
function agg(l,p){
  if(p==='a')return {sec:l.ts,mwh:l.te,cnt:l.tc};
  const n=p==='t'?1:p==='7'?7:30;
  const a={sec:0,mwh:0,cnt:0};
  for(let k=30-n;k<30;k++){a.sec+=l.ds[k];a.mwh+=l.de[k];a.cnt+=l.dc[k]}
  return a;
}
function sumAgg(ls,p){return ls.reduce((a,l)=>{const x=agg(l,p);a.sec+=x.sec;a.mwh+=x.mwh;a.cnt+=x.cnt;return a},{sec:0,mwh:0,cnt:0})}
function series(ls,m,n){
  const out=[];
  for(let k=30-n;k<30;k++){
    let v=0;ls.forEach(l=>{v+=m==='h'?l.ds[k]:l.de[k]});
    out.push({v:v,day:ST.day?ST.day-(29-k):0});
  }
  return out;
}
function dayLbl(day,n){
  if(!day)return '';
  if(n<=7)return DAYN[lang][(day+4)%7];
  return String(new Date(day*86400000).getUTCDate());
}
function dateTxt(day){const d=new Date(day*86400000);return d.getUTCDate()+'/'+(d.getUTCMonth()+1)}
function chartEl(sr,m){
  const wrap=el('div','chart');
  const mx=Math.max.apply(null,sr.map(x=>x.v).concat([1]));
  sr.forEach((x,j)=>{
    const c=el('div','cb');
    const w=el('div','cw');
    const bar=el('div','cbar'+(j===sr.length-1?' td':''));
    bar.style.height=(x.v>0?Math.max(3,Math.round(x.v/mx*100)):0)+'%';
    w.append(bar);
    const show=sr.length<=7||(sr.length-1-j)%5===0;
    c.append(w,el('div','cl',show?dayLbl(x.day,sr.length):''));
    c.onclick=()=>toast((x.day?dateTxt(x.day)+':  ':'')+fmtM(m,x.v));
    wrap.append(c);
  });
  return wrap;
}
function kpi(ico,val,lab){

}
function kpiRow(a){

function lightLabel(i){

function otaFmtDate(e){if(!e)return '';const d=new Date(e*1000);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function otaUp(f,onp){
  return new Promise(res=>{
    const x=new XMLHttpRequest();
    x.open('POST','/api/ota');
    if(token)x.setRequestHeader('X-Token',token);
    x.upload.onprogress=e=>{if(e.lengthComputable)onp(e.loaded/e.total)};
    x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}res(j)};
    x.onerror=()=>res({ok:false,err:'net'});
    x.ontimeout=()=>res({ok:false,err:'net'});
    x.timeout=300000;
    const fd=new FormData();fd.append('fw',f,f.name);x.send(fd);
  });
}
async function otaWaitBack(msg){
  msg.className='msg';msg.textContent=t('ota_restart');
  const t0=Date.now();
  await new Promise(r=>setTimeout(r,6000));
  while(Date.now()-t0<90000){
    try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok){location.reload();return}}catch(e){}
    await new Promise(r=>setTimeout(r,2000));
  }
  msg.className='msg err';msg.textContent=t('ota_noback');
}
function otaSection(){

  const info=el('div','msg','...');
  const fi=el('input','fld');fi.type='file';
  const pg=el('div','prog hide');pg.append(document.createElement('i'));
  const msg=el('div','msg hide');
  const bu=el('button','btn',t('up'));
  const rb=el('button','btn sec2 hide',t('ota_rb'));
  api('/api/fwinfo').then(r=>{
    if(!r.fw){info.textContent=t('err');return}
    let x=t('ota_cur')+': '+r.fw+'  ('+r.built+')';
    if(r.from)x+='\n'+t('ota_last')+': '+r.from+' → '+r.fw+(r.when?'  '+otaFmtDate(r.when):'');
    if(r.prevOk){x+='\n'+t('ota_prev')+': '+r.prevBuilt;rb.classList.remove('hide')}
    info.style.whiteSpace='pre-line';info.textContent=x;
  }).catch(()=>{info.textContent=t('err')});
  const note=el('div','msg',t('ota_h'));
  const lock=on=>{bu.disabled=on;rb.disabled=on;fi.disabled=on};
  const fail=e=>{msg.classList.remove('hide');msg.className='msg err';msg.textContent=t('ota_e_'+e)==='ota_e_'+e?t('err'):t('ota_e_'+e)};
  bu.onclick=async()=>{

    if(!/\.bin$/i.test(f.name)){fail('notapp');return}
    if(/factory/i.test(f.name)){fail('factory');return}
    if(!confirm(t('ota_q')))return;
    lock(true);pg.classList.remove('hide');const bar=pg.firstChild;bar.style.width='0';
    msg.className='msg';msg.textContent=t('ota_up');
    const r=await otaUp(f,x=>{bar.style.width=Math.round(x*100)+'%'});
    if(r.ok){bar.style.width='100%';await otaWaitBack(msg)}
    else{pg.classList.add('hide');lock(false);fail(r.err||'net')}
  };
  rb.onclick=async()=>{
    if(!confirm(t('ota_rbq')))return;
    lock(true);

    else{lock(false);msg.classList.remove('hide');msg.className='msg err';msg.textContent=r.err==='noprev'?t('ota_e_noprev'):t('err')}
  };
  su.append(info,note,fi,pg,msg,bu,rb);

}

/* ---------- scrolling text on the OLED ---------- */
const MQMAX=2400;
const MQ={sp:2,rep:1,m:0};
function mqRender(text){
  const font='bold 22px system-ui,"Noto Sans Arabic","Segoe UI",Roboto,Arial,sans-serif';
  const rtl=/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/.test(text);
  const c0=document.createElement('canvas').getContext('2d');
  c0.font=font;c0.direction=rtl?'rtl':'ltr';
  const w=Math.max(8,Math.ceil(c0.measureText(text).width)+8);
  if(w>MQMAX)return null;
  const c=document.createElement('canvas');c.width=w;c.height=32;
  const y=c.getContext('2d');
  y.font=font;y.direction=rtl?'rtl':'ltr';y.textBaseline='middle';y.textAlign=rtl?'right':'left';
  y.fillStyle='#000';y.fillRect(0,0,w,32);y.fillStyle='#fff';
  y.fillText(text,rtl?w-4:4,17);
  const px=y.getImageData(0,0,w,32).data;
  const rb=Math.ceil(w/8),out=new Uint8Array(rb*32);
  for(let r=0;r<32;r++)for(let q=0;q<w;q++)if(px[(r*w+q)*4]>110)out[r*rb+(q>>3)]|=0x80>>(q&7);
  return{w,rtl,out};
}
function mqPreview(cv,g){
  const x=cv.getContext('2d');
  if(!g){cv.width=128;cv.height=32;x.fillStyle='#000';x.fillRect(0,0,128,32);return}
  cv.width=g.w;cv.height=32;
  const im=x.createImageData(g.w,32),rb=Math.ceil(g.w/8);
  for(let r=0;r<32;r++)for(let q=0;q<g.w;q++){
    const on=(g.out[r*rb+(q>>3)]>>(7-(q&7)))&1,k=(r*g.w+q)*4;
    im.data[k]=im.data[k+1]=im.data[k+2]=on?255:0;im.data[k+3]=255;
  }
  x.putImageData(im,0,0);
}

}

/* --- scene editor --- */
async function startScene(i){
  if(!can(P_EDIT)){loginUI(()=>startScene(i),P_EDIT);return}
  const r=await api('/api/scenes');
  if(r._s===401){loginUI(()=>startScene(i),P_EDIT);return}
  if(!r.ok){toast(t('err'));return}
  SCN=r;
  if(i<0){
    if(r.list.length>=r.max){toast(t('maxScenes'));return}
    SED={i:-1,n:'',ic:0,st:[0,0,0,0,0,0,0,0],b:[0,0,0,0,0,0,0,0]};
  }else{
    const x=r.list[i];if(!x){scenesHub();return}
    SED={i:i,n:x.n,ic:x.ic,st:x.st.slice(),b:x.b.slice()};
  }
  sceneEdit();
}
function sceneEdit(){
  const m=$('modal');m.innerHTML='';
  const sh=el('div','sheet');
  sh.append(el('h2','',SED.i<0?t('newScene'):t('editScene')));
  const s1=sec(t('sceneName'),'scene');
  const ni=el('input','fld');ni.maxLength=18;ni.value=SED.n;ni.oninput=()=>{SED.n=ni.value};
  s1.append(ni);
  const ics=el('div','chips');
  SCI.forEach((n,k)=>{const b=el('button','chip ci'+(SED.ic===k?' on':''));b.innerHTML=icon(n);b.onclick=()=>{SED.ic=k;sceneEdit()};ics.append(b)});
  s1.append(ics);sh.append(s1);
  const s2=sec(t('lightsT'),'bulb');
  const cp=el('button','btn sm sec2',t('capture'));
  cp.onclick=()=>{S.ch.forEach(c=>{SED.st[c.i]=c.on?2:1;SED.b[c.i]=c.on?c.b:0});toast(t('capDone'));sceneEdit()};
  s2.append(cp);
  S.rooms.forEach(r=>{
    if(r.ch.length>1)s2.append(el('div','grp',r.n));
    r.ch.forEach(i=>{
      const row=el('div','lrow');
      row.append(el('div','ln',r.ch.length>1?S.ch[i].n:r.n));
      row.append(seg([[0,t('stKeep')],[1,t('stOff')],[2,t('stOn')]],SED.st[i],v=>{SED.st[i]=v;if(v===2&&SED.b[i]===0)SED.b[i]=0;sceneEdit()}));
      if(SED.st[i]===2){
        const keep=el('button','chip'+(SED.b[i]===0?' on':''),t('keepBri'));
        keep.style.marginTop='8px';
        keep.onclick=()=>{SED.b[i]=SED.b[i]===0?100:0;sceneEdit()};
        row.append(keep);
        if(SED.b[i]>0){
          const st=el('div','msg',t('briL')+' '+SED.b[i]+'%');
          const sl=document.createElement('input');sl.type='range';sl.min=1;sl.max=100;sl.value=SED.b[i];sl.style.setProperty('--v',SED.b[i]+'%');sl.style.opacity=1;
          sl.oninput=()=>{SED.b[i]=+sl.value;sl.style.setProperty('--v',sl.value+'%');st.textContent=t('briL')+' '+sl.value+'%'};
          row.append(st,sl);
        }
      }
      s2.append(row);
    });
  });
  sh.append(s2);
  const out=el('div','msg err');sh.append(out);
  const row=el('div','row');
  const sv=el('button','btn',t('save'));sv.style.flex='1';
  sv.onclick=async()=>{
    const nm=SED.n.trim();
    if(!nm){out.textContent=t('needName');return}
    if(!SED.st.some(v=>v>0)){out.textContent=t('pickAny');return}
    const o={n:nm,ic:SED.ic,st:SED.st.slice(),b:SED.st.map((v,i)=>v===2?SED.b[i]:0)};
    const list=SCN.list.slice();
    if(SED.i<0)list.push(o);else list[SED.i]=o;
    if(await saveScenes(list))scenesHub();
  };
  const bk=el('button','btn sec2',t('back'));bk.onclick=scenesHub;
  row.append(bk,sv);
  if(SED.i>=0){
    const dl=el('button','btn bad sm');dl.innerHTML=icon('trash');dl.style.fontSize='20px';
    dl.onclick=async()=>{const list=SCN.list.filter((x,j)=>j!==SED.i);if(await saveScenes(list))scenesHub()};
    row.append(dl);
  }
  sh.append(row);m.append(sh);
}
async function saveScenes(list){
  const r=await api('/api/scenes','POST',{list:list});
  if(r._s===401){loginUI(()=>startScene(SED?SED.i:-1),P_EDIT);return false}
  if(!r.ok){toast(t('err'));return false}
  SCN=r;
  const st=await api('/api/state');if(st.ch){S=st;if(!S.rooms)S.rooms=S.ch.map(c=>({id:c.i,n:c.n,ch:[c.i]}));dashUpdate()}
  toast(t('saved'));return true;
}
/* --- vacation mode --- */
function durTxt(h){return h<24?h+' '+t('hr'):(h/24)+' '+t('dayU')}
function dtTxt(e){return new Date(e*1000).toLocaleString(lang==='ar'?'ar':'en',{dateStyle:'medium',timeStyle:'short'})}
let VF='',VT='';
async function vacSend(b,okMsg){
  if(!can(P_EDIT)){loginUI(openScenes,P_EDIT);return}
  const r=await api('/api/vac','POST',b);
  if(r._s===401){loginUI(openScenes,P_EDIT);return}
  if(r.ok){VAC=r;toast(okMsg);const st=await api('/api/state');if(st.ch){S=st;dashUpdate()}scenesHub()}
  else toast(r.err==='time'?t('vacNoTime'):r.err==='range'?t('vac_range'):t('err'));
}
function vacCard(){
  const c=sec(t('vacT'),'plane');
  c.append(el('div','msg',t('vacH')));
  if(!VAC){c.append(el('div','msg','...'));return c}
  const v=VAC;
  if(v.active){
    const lv=el('div','live');lv.append(el('i'),el('span','',t('vacOn')+' \u00b7 '+t('vacLeft')),el('b','',fmtDur(v.left)));
    c.append(lv);
    if(v.end)c.append(el('div','msg',t('vac_ends')+': '+dtTxt(v.end)));
    if(can(P_EDIT)){
      const sp=el('button','btn bad',t('vacStop'));sp.style.width='100%';
      sp.onclick=()=>vacSend({stop:true},t('vacStopped'));
      c.append(sp);
    }
  }else if(v.from){
    c.append(el('div','warn2',t('vac_planned')+': '+dtTxt(v.from)+' '+ARW()+' '+dtTxt(v.end)));
    if(can(P_EDIT)){
      const sp=el('button','btn bad',t('vac_cancel'));sp.style.width='100%';
      sp.onclick=()=>vacSend({stop:true},t('vacStopped'));
      c.append(sp);
    }
  }else if(!can(P_EDIT)){
    c.append(el('div','msg',t('vac_adminOnly')));
  }else{
    if(!v.tv)c.append(el('div','warn2',t('vacNoTime')));
    else if(!v.slots||!v.mask)c.append(el('div','warn2',t('vacNone')));
    else{
      c.append(el('div','msg',t('vacLearn')+' '+v.days+' '+t('dayU')));
      if(v.days<7)c.append(el('div','warn2',t('vacLow')));
    }
    c.append(el('div','grp',t('vac_plan')));
    const f1=el('input','fld');f1.type='datetime-local';f1.value=VF;f1.onchange=()=>{VF=f1.value};
    const f2=el('input','fld');f2.type='datetime-local';f2.value=VT;f2.onchange=()=>{VT=f2.value};
    c.append(el('div','msg',t('vac_from')),f1,el('div','msg',t('vac_to')),f2);
    const pb=el('button','btn',t('vac_planBtn'));pb.style.width='100%';pb.style.marginTop='8px';
    pb.disabled=!v.tv||!v.mask;
    pb.onclick=()=>{
      VF=f1.value;VT=f2.value;
      if(!VT){toast(t('vac_range'));return}
      const to=Math.floor(new Date(VT).getTime()/1000);
      const from=VF?Math.floor(new Date(VF).getTime()/1000):0;
      if(!(to>Date.now()/1000)||(from&&to<=from)){toast(t('vac_range'));return}
      vacSend({from:from,to:to},t('vacStarted'));
    };
    c.append(pb);
    c.append(el('div','grp',t('vac_or')));
    const ch=el('div','chips');
    [6,12,24,48,72,120,168,336].forEach(h=>{const b=el('button','chip'+(VH===h?' on':''),durTxt(h));b.onclick=()=>{VH=h;scenesHub()};ch.append(b)});
    c.append(ch);
    const go=el('button','btn sec2',t('vacStart'));go.style.width='100%';go.style.marginTop='8px';
    go.disabled=!v.tv||!v.mask;
    go.onclick=()=>vacSend({hours:VH},t('vacStarted'));
    c.append(go);
  }
  c.append(el('div','msg',t('vacNote')));
  return c;
}
/* --- event log --- */
async function openLog(){
  if(!can(P_LOG)){loginUI(openLog,P_LOG);return}
  const r=await api('/api/log');
  if(r._s===401){loginUI(openLog,P_LOG);return}
  if(!r.ok){toast(t('err'));return}
  LG=r;logRender();
}
function evWhen(ts){
  if(!ts)return t('logNoTime');
  const z=S.tzo||0;
  const lt=Math.floor(ts/60)+z;
  const day=Math.floor(lt/1440),mod=((lt%1440)+1440)%1440;
  const nowL=Math.floor((S.t||Date.now()/1000)/60)+z;
  const td=Math.floor(nowL/1440);
  if(day===td)return hm(mod);
  if(day===td-1)return t('yday')+' '+hm(mod);
  return dateTxt(day)+' '+hm(mod);
}
function evInfo(e){
  const ty=e[1],arg=e[2],val=e[3];
  if(ty===1){const c=S.ch[arg];return{ic:'bulb',on:val>0,tx:(c?c.n:'#'+(arg+1))+' · '+(val>0?t('evOn')+' '+val+'%':t('evOff'))}}
  if(ty===2){const r=S.rooms.find(x=>x.id===arg);return{ic:'room',on:val>0,tx:(r?r.n:'#'+(arg+1))+' · '+(val?t('evOn'):t('evOff'))}}
  if(ty===3)return{ic:'power',on:val>0,tx:val?t('evAllOn'):t('evAllOff')};
  if(ty===4){const x=(S.sc||[]).find(q=>q.i===arg);return{ic:x?(SCI[x.ic]||'star'):'scene',on:true,tx:t('evScene')+' · '+(x?x.n:'#'+(arg+1))}}
  if(ty===5)return{ic:'clock',on:val>0,tx:(val?t('evSchedOn'):t('evSchedOff'))+' · '+targetsTxt(arg)};
  if(ty===6)return{ic:'plane',on:val===1,tx:val===1?t('evVacStart'):val===2?t('evVacEnd'):t('evVacStop')};
  if(ty===7){const k=['bootPower','bootSw','bootCrash','bootBrown','bootOther'][val]||'bootOther';return{ic:'chip',on:val===2,tx:t('evBoot')+' · '+t(k)}}
  return{ic:'log',on:false,tx:'?'};
}
function logRender(){
  const m=$('modal');m.innerHTML='';
  const sh=el('div','sheet');
  sh.append(el('h2','',t('logT')));
  const fl=[['all',t('logAll')],['man',t('logManual')],['auto',t('logAuto')],['sys',t('logSys')]];
  sh.append(seg(fl,LGF,v=>{LGF=v;logRender()}));
  const SRCN=[t('srcApp'),t('srcWall'),t('srcSched'),t('srcAuto'),t('srcScene'),t('srcVac'),t('srcSys'),t('srcRemote')];
  const grp=s=>(s<=1||s===7)?'man':s===6?'sys':'auto';
  const rows=LG.e.filter(e=>LGF==='all'||grp(e[4])===LGF);
  if(!rows.length)sh.append(el('div','msg',t('logEmpty')));
  const box=el('div','sec');
  rows.forEach(e=>{
    const f=evInfo(e);
    const r=el('div','ev');
    const ico=el('div','ico');ico.innerHTML=icon(f.ic);
    if(f.on){ico.style.background='var(--acc)';ico.style.color='var(--onacc)'}
    const mid=el('div','mid');
    const wh=e[5]===255?t('ac_delAcc'):(e[5]?((LG.an||[])[e[5]-1]||(e[5]===1?t('ac_adminDef'):'')):'');
    mid.append(el('div','t1',f.tx),el('div','t2',(wh?wh+' · ':'')+(SRCN[e[4]]||'')+' · '+evWhen(e[0])));
    r.append(ico,mid);box.append(r);
  });
  if(rows.length)sh.append(box);
  const row=el('div','row');
  const bk=el('button','btn sec2',t('back'));bk.onclick=scenesHub;
  row.append(bk);
  if(LG.e.length&&S.adm){
    const cb=el('button','btn bad sm',t('logClear'));
    cb.onclick=async()=>{
      if(!confirm(t('sure')))return;
      const r=await api('/api/log/clear','POST',{});
      if(r.ok){LG.e=[];logRender()}else toast(t('err'));
    };
    row.append(cb);
  }
  sh.append(row);m.append(sh);
}
/* ---------- setup wizard ---------- */
const W={step:0,pin:'',pin2:'',ssid:'',pass:'',apS:'Smart-Light',apP:'',fbUrl:'',fbKey:'',names:[]};
for(let i=0;i<8;i++)W.names.push((lang==='ar'?'غرفة ':'Room ')+(i+1));
function wizShow(){
  look();
  const a=$('app');a.innerHTML='';
  const box=el('div','wiz');a.append(box);
  const dots=el('div','dots');
  for(let i=0;i<7;i++){const d=document.createElement('i');if(i<=W.step)d.className='d';dots.append(d)}
  box.append(dots);
  const lg=el('div','logo');lg.innerHTML=icon('bulb');box.append(lg);
  const nav=el('div','nav');
  const bb=el('button','btn sec2',t('back'));bb.onclick=()=>{W.step--;wizShow()};
  const bn=el('button','btn',t('next'));
  const msg=el('div','msg err');
  const s=W.step;
  if(s===0){
    box.append(el('h2','',t('wTitle')),el('p','',t('wText')));
    const r=el('div','row');
    const b1=el('button','btn sec2 sm',t('lang'));b1.onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('lang',lang);wizShow()};
    const b2=el('button','btn sec2 sm',t('theme'));b2.onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];localStorage.setItem('theme',theme);look()};
    r.append(b1,b2);box.append(r);
    bn.onclick=()=>{W.step=1;wizShow()};
    nav.append(el('span'),bn);
  }else if(s===1){
    box.append(el('h2','',t('wPin')),el('p','',t('wPinH')));
    const p1=el('input','fld');p1.type='password';p1.maxLength=32;p1.value=W.pin;p1.oninput=()=>W.pin=p1.value;
    const p2=el('input','fld');p2.type='password';p2.maxLength=32;p2.placeholder=t('pin2');p2.value=W.pin2;p2.oninput=()=>W.pin2=p2.value;
    box.append(p1,p2,msg);
    bn.onclick=()=>{
      if(W.pin.length<4||W.pin.length>32){msg.textContent=t('pinBad');return}
      if(W.pin!==W.pin2){msg.textContent=t('pinMis');return}
      W.step=2;wizShow();
    };
    nav.append(bb,bn);
  }else if(s===2){
    box.append(el('h2','',t('wWifi')));
    const sel=el('select','fld');
    const sc=el('button','btn sm sec2',t('scan'));sc.onclick=()=>scanInto(sel,sc);
    const pw=el('input','fld');pw.type='password';pw.placeholder=t('pass');pw.value=W.pass;pw.oninput=()=>W.pass=pw.value;
    sel.onchange=()=>W.ssid=sel.value;
    if(W.ssid){const o=document.createElement('option');o.value=W.ssid;o.textContent=W.ssid;sel.append(o)}
    box.append(sc,sel,pw);
    bn.onclick=()=>{if(sel.value)W.ssid=sel.value;W.step=3;wizShow()};
    const sk=el('button','btn sec2',t('skip'));sk.onclick=()=>{W.ssid='';W.pass='';W.step=3;wizShow()};
    nav.append(bb,sk,bn);
  }else if(s===3){
    box.append(el('h2','',t('wOwn')),el('p','',t('wOwnH')));
    const a1=el('input','fld');a1.placeholder=t('ssid');a1.value=W.apS;a1.oninput=()=>W.apS=a1.value;
    const a2=el('input','fld');a2.type='password';a2.placeholder=t('pwHint');a2.value=W.apP;a2.oninput=()=>W.apP=a2.value;
    box.append(a1,a2,msg);
    bn.onclick=()=>{
      if(W.apP.length<8){msg.textContent=t('pwHint');return}
      if(!W.apS.trim()){msg.textContent=t('ssid');return}
      W.step=4;wizShow();
    };
    nav.append(bb,bn);
  }else if(s===4){
    box.append(el('h2','',t('wFb')),el('p','',t('wFbH')));
    const f1=el('input','fld');f1.placeholder='https://xxxx-default-rtdb.firebaseio.com';f1.value=W.fbUrl;f1.style.direction='ltr';f1.oninput=()=>W.fbUrl=f1.value;
    const f2=el('input','fld');f2.placeholder=t('fb_key');f2.value=W.fbKey;f2.style.direction='ltr';f2.oninput=()=>W.fbKey=f2.value;
    box.append(f1,f2,msg);
    bn.onclick=()=>{
      const u=W.fbUrl.trim(),k=W.fbKey.trim();
      if(u||k){
        if(!/^https:\/\//.test(u)){msg.textContent=t('wFbBad');return}
        if(k.length<10){msg.textContent=t('wFbBad');return}
      }
      W.step=5;wizShow();
    };
    const sk=el('button','btn sec2',t('skip'));sk.onclick=()=>{W.fbUrl='';W.fbKey='';W.step=5;wizShow()};
    nav.append(bb,sk,bn);
  }else if(s===5){
    box.append(el('h2','',t('wRooms')),el('p','',t('wRoomsH')));
    for(let i=0;i<8;i++){
      const row=el('div','row');
      const ri=el('div','rico');ri.innerHTML=icon(roomIcon(W.names[i]));
      const n=el('input','fld');n.maxLength=24;n.value=W.names[i];n.oninput=()=>{W.names[i]=n.value;ri.innerHTML=icon(roomIcon(n.value))};
      const out=el('div','msg');
      row.append(ri,n,pairButton(i,out));
      box.append(row,out);
    }
    bn.onclick=()=>{W.step=6;wizShow()};
    nav.append(bb,bn);
  }else{
    box.append(el('h2','',t('fin')));
    box.append(msg);
    const go=el('button','btn',t('fin'));
    go.onclick=async()=>{
      go.disabled=true;
      const r=await api('/api/setup','POST',{pw:W.pin,ssid:W.ssid,pass:W.pass,apSsid:W.apS.trim(),apPass:W.apP,fbUrl:W.fbUrl.trim(),fbKey:W.fbKey.trim(),names:W.names.map(x=>x.trim())});
      if(r.ok){
        box.innerHTML='';
        box.append(el('h2','',t('fin')),el('p','',t('done')));
        const u=el('p','','http://smartlight.local');u.style.color='var(--acc)';u.dir='ltr';
        box.append(u);
        clearInterval(pollTimer);
      }else{msg.textContent=t('err');go.disabled=false}
    };
    nav.append(bb,go);
  }
  box.append(nav);
}
look();
poll();
const pollTimer=setInterval(poll,1500);
